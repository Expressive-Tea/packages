name: Feature Request
description: Suggest a new feature for @expressive-tea packages
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your feature suggestion! We appreciate your ideas.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package should this feature be in?
      options:
        - "@expressive-tea/commons"
        - "@expressive-tea/plugin"
        - "New Package"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Describe your ideal solution
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: If applicable, show what the API might look like
      placeholder: |
        ```typescript
        class MyPlugin extends Plugin {
          @Stage(BOOT_STAGES.NEW_STAGE)
          myNewMethod() {
            // your proposed usage
          }
        }
        ```
      render: typescript

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
      placeholder: Other approaches you've thought about

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Change
      description: Would this be a breaking change?
      options:
        - "No"
        - "Yes"
        - "Maybe/Not sure"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or examples
      placeholder: Add any other context or screenshots about the feature request here
