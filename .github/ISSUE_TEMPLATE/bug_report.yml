name: Bug Report
description: Report a bug in @expressive-tea packages
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@expressive-tea/commons"
        - "@expressive-tea/plugin"
        - "Other/Multiple"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      description: What version are you using?
      placeholder: "2.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: When I do X, Y happens but I expect Z
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Install package with `yarn add @expressive-tea/plugin`
        2. Create plugin with...
        3. Run application
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      value: |
        - Node.js version: 
        - TypeScript version: 
        - Operating System: 
        - Package Manager: 
      render: markdown
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Sample
      description: Minimal code to reproduce the issue
      placeholder: |
        ```typescript
        import { Plugin } from '@expressive-tea/plugin';
        
        class MyPlugin extends Plugin {
          // your code here
        }
        ```
      render: typescript

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs
      placeholder: Add any other context about the problem here
